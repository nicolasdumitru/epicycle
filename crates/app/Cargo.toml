[package]
name = "epicycle"
description = "Local-first subscription tracker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "epicycle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
epicycle-core = { version = "0.2.0", path = "../core" }
jiff = "0.2.38"
# HTTPS for ECB exchange rates. rustls checks certificates against each
# platform's own trust store, which matters on iOS and Android.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
# Timers for refreshing exchange rates in the background, and waiting for the
# database at start-up; Tauri runs on tokio.
tokio = { version = "1.54.1", features = ["sync", "time"] }
ts-rs = "12"
uuid = { version = "1.29.0", features = ["v7"] }

# On Android, rustls' platform verifier needs Java-side setup (a Gradle
# dependency and JNI initialisation); Mozilla's root certificates, from the
# rustls project, avoid that. See docs/DECISIONS.md, "Exchange rates".
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.11"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
