[package]
name = "epicycle"
description = "Local-first subscription tracker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "epicycle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
epicycle-core = { version = "0.1.0", path = "../core" }
jiff = "0.2.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tauri = { version = "2.12.3", features = [] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
