# iOS builds on a macOS runner (free for public repositories).
#
# Step 1 of getting the app on an iPhone: prove that it builds for iOS. Nothing
# here is signed, so no Apple account is involved. The Nix dev shell isn't used:
# its libraries are for Linux, and Xcode comes with the runner.
name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same Tauri CLI version as the Nix dev shell.
  TAURI_CLI_VERSION: 2.12.2

jobs:
  # The Rust code, including the dialog plugin's Swift code, compiled for
  # iPhones and for the simulator.
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain with the iOS targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build for iPhone
        run: cargo build --package epicycle --lib --target aarch64-apple-ios
      - name: Build for the simulator
        run: cargo build --package epicycle --lib --target aarch64-apple-ios-sim

  # The whole app, through Tauri's generated Xcode project, for the simulator.
  # The project (crates/app/gen/apple) is generated here rather than committed
  # for now, and uploaded so it can be inspected.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
          version: 12.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Rust toolchain with the iOS targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Generate the Xcode project
        run: cargo tauri ios init --ci
      - name: Build for the simulator
        run: cargo tauri ios build --target aarch64-sim --debug
      - name: Keep the generated project and build output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-build
          path: crates/app/gen/apple
          if-no-files-found: warn
          retention-days: 7
