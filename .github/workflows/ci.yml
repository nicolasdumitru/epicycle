# Checks, lints and tests on Linux, in the same Nix dev shell as local work.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting, lints, type checks and sqlx metadata
        run: nix develop --command just check

      - name: Rust and frontend tests
        run: nix develop --command just test

      # `cargo test` regenerates the TypeScript bindings; they must be committed.
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- ui/src/lib/bindings
