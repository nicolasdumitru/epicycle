# Windows: the checks and tests, and the installers Tauri makes (NSIS .exe and
# .msi), built on GitHub's Windows runner. Not signed, so Windows SmartScreen
# warns before installing. Download them from the run's "Artifacts".
#
# The tools come from scripts/windows_env.py, at the flake's versions
# (toolchain.json), as on a Windows PC: this also tests that setup.
#
# release.yml also calls this workflow to build the installers for a release.
name: Windows

on:
  # Branches only: release tags are built by release.yml.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Named explicitly: when release.yml calls this workflow, github.workflow is
# "Release", which would put it in the same group as the Android build.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node, pnpm, just, Python and the Rust tools Cargo builds (tauri-cli,
      # sqlx-cli), until toolchain.json changes.
      - name: Tools cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\epicycle-dev
          key: windows-tools-${{ hashFiles('toolchain.json') }}
      - name: pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\pnpm\store
          key: windows-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Tools
        run: python scripts/windows_env.py install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The same commands as on Linux, in the Windows equivalent of the dev
      # shell: also the domain and storage code on Windows (paths, time zones).
      - name: Formatting, lints, type checks and sqlx metadata
        run: python scripts/windows_env.py run -- just check
      - name: Rust and frontend tests
        run: python scripts/windows_env.py run -- just test

      - name: Build the installers
        run: python scripts/windows_env.py run -- cargo tauri build

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epicycle-windows-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
