# Windows: the Rust tests, and the installers Tauri makes (NSIS .exe and .msi),
# built on GitHub's Windows runner. Not signed, so Windows SmartScreen warns
# before installing. Download them from the run's "Artifacts".
#
# The Nix dev shell isn't used: it's for Linux. Versions match it.
#
# release.yml also calls this workflow to build the installers for a release.
name: Windows

on:
  # Branches only: release tags are built by release.yml.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Named explicitly: when release.yml calls this workflow, github.workflow is
# "Release", which would put it in the same group as the Android build.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: 2.12.2

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json
          version: 12.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tauri CLI
        run: cargo install tauri-cli --version "$env:TAURI_CLI_VERSION" --locked
      - name: Frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # The domain and storage code on Windows: paths, line endings, time zones.
      - name: Rust tests
        run: cargo test --workspace

      - name: Build the installers
        run: cargo tauri build

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epicycle-windows-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
