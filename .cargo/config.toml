[env]
# Check sqlx queries against the committed metadata in .sqlx/ rather than a live
# database. scripts/sqlx_prepare.py overrides this when regenerating .sqlx/.
SQLX_OFFLINE = "true"

# TypeScript types generated by ts-rs for the UI (written by `cargo test`).
TS_RS_EXPORT_DIR = { value = "ui/src/lib/bindings", relative = true }
# Amounts cross the IPC boundary as decimal strings; the remaining integers are small.
TS_RS_LARGE_INT = "number"
